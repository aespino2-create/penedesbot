<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimcana Digital - Microbitada</title>
    <style>
        :root {
            --primary: #4a90e2; --secondary: #f39c12; --danger: #e74c3c;
            --success: #2ecc71; --dark: #2c3e50; --light: #f4f7f6;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #e9ecef; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 95%; max-width: 650px; text-align: center; }
        .hidden { display: none !important; }
        select, input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; }
        button { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-main { background-color: var(--primary); color: white; }
        .btn-start { background-color: var(--success); color: white; font-size: 1.5rem; }
        .btn-nav { background-color: var(--dark); color: white; }
        .btn-finish { background-color: var(--danger); color: white; width: 100%; }
        .viewer-container { position: relative; background: #000; border-radius: 10px; margin: 20px 0; line-height: 0; overflow: hidden; min-height: 250px; }
        .viewer-img { width: 100%; height: auto; display: block; }
        .nav-buttons { display: flex; justify-content: space-between; padding: 10px; background: #f8f9fa; border-radius: 0 0 10px 10px; }
        .lock-box { background: #fff3cd; padding: 20px; border: 2px dashed #ffc107; border-radius: 10px; margin: 15px 0; }
        #code-input { width: 100px; text-align: center; font-size: 2rem; letter-spacing: 5px; }
        #display-timer { font-size: 2.5rem; font-family: monospace; color: var(--danger); margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="step-school">
        <h2>Benvinguts a la Microbitada</h2>
        <p>Selecciona la teva escola per començar:</p>
        <select id="school-list">
            <option value="" disabled selected>Tria escola...</option>
            <option value="Escola 1">Escola 1</option>
            <option value="Escola 2">Escola 2</option>
            <option value="Escola 3">Escola 3</option>
            <option value="Escola 4">Escola 4</option>
            <option value="Escola 5">Escola 5</option>
            <option value="Escola 6">Escola 6</option>
            <option value="Escola 7">Escola 7</option>
            <option value="Escola 8">Escola 8</option>
        </select>
        <br><br>
        <button class="btn-main" onclick="goToGroups()">Següent</button>
    </div>

    <div id="step-groups" class="hidden">
        <h3 id="school-name-header" style="color:var(--primary)"></h3>
        <h2 id="group-title">Nom del Grup 1</h2>
        <input type="text" id="main-input" placeholder="Ex: Els Súpers">
        
        <div id="group-preview" class="hidden" style="text-align:left; background:#eee; padding:10px; margin:10px auto; width:80%;">
            <strong>Membres:</strong> <ul id="list-members"></ul>
        </div>

        <div style="margin-top:15px;">
            <button id="action-btn" class="btn-main" onclick="processLogic()">Afegir Grup</button>
            <button id="next-group-btn" class="hidden" style="background:var(--secondary); color:white" onclick="resetForNewGroup()">Nou Grup</button>
        </div>
        <button id="finalize-btn" class="btn-finish hidden" onclick="prepareToStart()">FINALITZAR CONFIGURACIÓ</button>
    </div>

    <div id="step-start" class="hidden">
        <h2>Preparats, <span id="current-group-name"></span>?</h2>
        <button class="btn-start" onclick="initChallenge()">START</button>
    </div>

    <div id="step-challenge" class="hidden">
        <div id="display-timer">00:00</div>
        <div class="viewer-container">
            <img src="" id="current-img" class="viewer-img" alt="Carregant imatge...">
        </div>
        <div id="navigation-zone" class="nav-buttons">
            <button id="btn-prev" class="btn-nav" onclick="nav(-1)">⬅ Enrere</button>
            <button id="btn-next" class="btn-nav" onclick="nav(1)">Endavant ➡</button>
        </div>
        <div id="lock-zone" class="lock-box hidden">
            <h3>🔒 REPTE BLOQUEJAT</h3>
            <p>Introdueix el codi de 3 xifres:</p>
            <input type="number" id="code-input" placeholder="000">
            <br>
            <button class="btn-main" onclick="validateCode()">VERIFICAR</button>
        </div>
        <button id="btn-finish-all" class="btn-finish hidden" onclick="endGroupSession()">🏆 ACABAR REPTE 🏆</button>
    </div>

    <div id="step-results" class="hidden">
        <h2>Classificació Final</h2>
        <h4 id="result-school-title"></h4>
        <table style="width:100%; border-collapse: collapse;">
            <thead><tr style="background:#ddd"><th>Pos</th><th>Grup</th><th>Temps</th></tr></thead>
            <tbody id="leaderboard-rows"></tbody>
        </table>
        <br><button class="btn-main" onclick="location.reload()">Nou Joc</button>
    </div>
</div>

<script>
    // --- CONFIGURACIÓ URLS ---
    const BASE_URL = "https://raw.githubusercontent.com/aespino2-create/Microbitada-imatges/main";
    const images = [
        BASE_URL + "/01.jpg",
        BASE_URL + "/02.jpg",
        BASE_URL + "/03.jpg",
        BASE_URL + "/04.jpg",
        BASE_URL + "/05.jpg",
        BASE_URL + "/06.jpg",
        BASE_URL + "/07.jpg",
        BASE_URL + "/08.jpg",
        BASE_URL + "/09.jpg",
        BASE_URL + "/10.jpg"
    ];
    const SECRET_CODE = "123"; 

    // --- ESTAT ---
    let school = "";
    let allGroups = [];
    let tempGroup = { name: "", members: [] };
    let namingPhase = true;
    let activeGroupIdx = 0;
    let currentImgIdx = 0;
    let timerInterval;
    let startTime;
    let codeUnlocked = false;
    let finalRanking = [];

    // --- FUNCIONS NAVEGACIÓ ---
    function goToGroups() {
        const list = document.getElementById('school-list');
        school = list.value;
        if(!school) {
            alert("Si us plau, tria una escola.");
            return;
        }
        document.getElementById('step-school').classList.add('hidden');
        document.getElementById('step-groups').classList.remove('hidden');
        document.getElementById('school-name-header').innerText = "Escola: " + school;
    }

    function processLogic() {
        const input = document.getElementById('main-input');
        const val = input.value.trim();
        if(!val) return;

        if(namingPhase) {
            tempGroup.name = val;
            namingPhase = false;
            input.value = "";
            input.placeholder = "Nom de l'alumne";
            document.getElementById('group-title').innerText = "Membres de: " + tempGroup.name;
            document.getElementById('action-btn').innerText = "Afegir Alumne";
            document.getElementById('group-preview').classList.remove('hidden');
        } else {
            tempGroup.members.push(val);
            const li = document.createElement('li');
            li.textContent = val;
            document.getElementById('list-members').appendChild(li);
            input.value = "";
            document.getElementById('next-group-btn').classList.remove('hidden');
            document.getElementById('finalize-btn').classList.remove('hidden');
        }
    }

    function resetForNewGroup() {
        allGroups.push(JSON.parse(JSON.stringify(tempGroup)));
        tempGroup = { name: "", members: [] };
        namingPhase = true;
        const input = document.getElementById('main-input');
        input.placeholder = "Nom del grup";
        document.getElementById('group-title').innerText = "Nom del Grup " + (allGroups.length + 1);
        document.getElementById('action-btn').innerText = "Afegir Grup";
        document.getElementById('list-members').innerHTML = "";
        document.getElementById('group-preview').classList.add('hidden');
        document.getElementById('next-group-btn').classList.add('hidden');
    }

    function prepareToStart() {
        if(tempGroup.name) allGroups.push(JSON.parse(JSON.stringify(tempGroup)));
        document.getElementById('step-groups').classList.add('hidden');
        document.getElementById('step-start').classList.remove('hidden');
        document.getElementById('current-group-name').innerText = allGroups[activeGroupIdx].name;
    }

    function initChallenge() {
        document.getElementById('step-start').classList.add('hidden');
        document.getElementById('step-challenge').classList.remove('hidden');
        currentImgIdx = 0;
        codeUnlocked = false;
        updateViewer();
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        const diff = Date.now() - startTime;
        const m = Math.floor(diff/60000).toString().padStart(2,'0');
        const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        document.getElementById('display-timer').innerText = m + ":" + s;
    }

    function updateViewer() {
        const img = document.getElementById('current-img');
        img.src = images[currentImgIdx];
        
        document.getElementById('btn-prev').style.visibility = (currentImgIdx === 0) ? "hidden" : "visible";
        
        if(currentImgIdx === 5 && !codeUnlocked) {
            document.getElementById('navigation-zone').classList.add('hidden');
            document.getElementById('lock-zone').classList.remove('hidden');
        } else {
            document.getElementById('navigation-zone').classList.remove('hidden');
            document.getElementById('lock-zone').classList.add('hidden');
        }

        if(currentImgIdx === images.length - 1) {
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-finish-all').classList.remove('hidden');
        } else {
            document.getElementById('btn-next').classList.remove('hidden');
            document.getElementById('btn-finish-all').classList.add('hidden');
        }
    }

    function nav(dir) {
        currentImgIdx += dir;
        updateViewer();
    }

    function validateCode() {
        const input = document.getElementById('code-input').value;
        if(input === SECRET_CODE) {
            codeUnlocked = true;
            nav(1);
        } else {
            alert("Codi incorrecte!");
        }
    }

    // --- FUNCIÓ GOOGLE SHEETS ---
    function enviarAGoogleSheets(escola, grup, temps) {
        // SUBSTITUEIX "ID_FORMULARI" pel codi llarg del teu Google Form
        const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSdvo_g3lmgF3-olwtcpW2-ubQmXN5QC8lOazSiriLIGz1u5cQ/formResponse";
        
        const dades = new URLSearchParams();
        // Substitueix entry.XXXXX pels números que t'ha donat el formulari
        dades.append('entry.1631258756', escola); 
        dades.append('entry.1277977719', grup);   
        dades.append('entry.1028009594', temps);  

        fetch(formURL, {
            method: 'POST',
            mode: 'no-cors',
            body: dades
        }).then(() => {
            console.log("Enviat a Google Sheets");
        }).catch(err => console.log("Error enviant:", err));
    }

    function endGroupSession() {
        clearInterval(timerInterval);
        const timeStr = document.getElementById('display-timer').innerText;
        const currentGroupName = allGroups[activeGroupIdx].name;

        // ENVIAR DADES AL FULL DE CÀLCUL
        enviarAGoogleSheets(school, currentGroupName, timeStr);

        finalRanking.push({ 
            name: currentGroupName, 
            timeStr: timeStr, 
            timeMs: Date.now() - startTime 
        });
        
        activeGroupIdx++;
        if(activeGroupIdx < allGroups.length) {
            document.getElementById('step-challenge').classList.add('hidden');
            document.getElementById('step-start').classList.remove('hidden');
            document.getElementById('current-group-name').innerText = allGroups[activeGroupIdx].name;
        } else {
            showFinalResults();
        }
    }

    function showFinalResults() {
        document.getElementById('step-challenge').classList.add('hidden');
        document.getElementById('step-results').classList.remove('hidden');
        document.getElementById('result-school-title').innerText = "Escola: " + school;
        finalRanking.sort((a,b) => a.timeMs - b.timeMs);
        const tbody = document.getElementById('leaderboard-rows');
        tbody.innerHTML = "";
        finalRanking.forEach((res, i) => {
            tbody.innerHTML += "<tr><td>" + (i+1) + "</td><td>" + res.name + "</td><td>" + res.timeStr + "</td></tr>";
        });
    }
</script>
</body>
</html>
